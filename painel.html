<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel do Chef — D'Faria Gastronomia</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2"/><link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"/><link rel="icon" href="/favicon.ico?v=2" type="image/x-icon"/>

  <!-- Google Fonts Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN (Painel Administrativo Privado) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dfgreen: '#173023',
            dfgreendeep: '#0F2118',
            dfgold: '#C5A880',
            dfsand: '#F7F4EE',
            dfivory: '#FDFBF7'
          },
          fontFamily: {
            display: ['Outfit', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #F7F4EE; color: #173023; font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Outfit', sans-serif; }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F7F4EE; }
    ::-webkit-scrollbar-thumb { background: #C5A880; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-dfgold selection:text-white">

  <div id="app" class="flex-1 flex flex-col">
    <!-- O Javascript renderiza a interface aqui (Login ou Painel) -->
    <div class="flex-1 flex items-center justify-center p-6">
      <div class="flex items-center gap-3 text-dfgreen font-medium">
        <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-dfgold"></i>
        <span>Carregando Painel do Chef...</span>
      </div>
    </div>
  </div>

  <script src="/assets/tema-gerador.js?v=20261124c"></script>
  <script src="/assets/foto-tratamento.js?v=20261124a"></script>
  <script type="module" src="/assets/painel-chef-v3.js?v=20261123a"></script>
</body>
</html>
